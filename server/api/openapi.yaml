openapi: "3.0.3"
info:
  title: Control Ward
  version: "0.0.1"
  description: |
    [Placeholder]

servers:
  - url: http://localhost:3000/

tags:
  - name: Health
    description: Service health and availability

paths:
  /health:
    get:
      tags:
        - Health
      summary: Ping the service
      description: |
        Simple health-check endpoint. Confirms that the service is running and has a database connection.
      responses:
        "200":
          description: The service is functional.
        "500":
          description: The service failed to respond normally. Check the server logs.
  /account/{gameName}/{tagLine}:
    get:
      summary: Get player account information
      description: Returns Riot account information for the specified game name and tagline.
      operationId: getAccount
      tags:
        - Accounts

      parameters:
        - name: gameName
          in: path
          required: true
          description: Riot game name.
          schema:
            type: string

        - name: tagLine
          in: path
          required: true
          description: Riot tagline.
          schema:
            type: string

      responses:
        "200":
          description: Account information retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"

        "400":
          description: Invalid game name or tagline.
          content:
            text/plain:
              schema:
                type: string

        "404":
          description: Account not found.
          content:
            text/plain:
              schema:
                type: string

        "429":
          description: Riot API rate limit exceeded.
          content:
            text/plain:
              schema:
                type: string

        "500":
          description: Internal server error.
          content:
            text/plain:
              schema:
                type: string
  /rank/{server}/{puuid}:
    get:
      summary: Get player's solo queue rank
      description: >
        Returns the player's Ranked Solo/Duo information for the specified
        League of Legends server. If the player is unranked in Solo Queue,
        a 404 response is returned.
      operationId: getRank
      tags:
        - Ranked

      parameters:
        - name: server
          in: path
          required: true
          description: League of Legends server (e.g. `na1`, `euw1`, `kr`).
          schema:
            type: string

        - name: puuid
          in: path
          required: true
          description: Riot PUUID.
          schema:
            type: string

      responses:
        "200":
          description: Ranked information retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rank"

        "400":
          description: Invalid server or PUUID.
          content:
            text/plain:
              schema:
                type: string

        "404":
          description: Player not found or has no Ranked Solo/Duo entry.
          content:
            text/plain:
              schema:
                type: string

        "429":
          description: Riot API rate limit exceeded.
          content:
            text/plain:
              schema:
                type: string

        "500":
          description: Internal server error.
          content:
            text/plain:
              schema:
                type: string

components:
  schemas:
    Account:
      type: object
      required:
        - gameName
        - tagLine
        - puuid
        - server
      properties:
        gameName:
          type: string
          example: Hide on bush

        tagLine:
          type: string
          example: KR1

        puuid:
          type: string
          description: Riot's globally unique player identifier.
          example: cQh4lD1Q7vK1L3o4...

        server:
          type: string
          description: The server/region the account belongs to.
          example: kr
          
    Rank:
      type: object
      required:
        - tier
        - rank
        - puuid
        - leaguePoints
        - wins
        - losses
      properties:
        tier:
          type: string
          description: Ranked tier.
          example: DIAMOND

        rank:
          type: string
          description: Division within the tier.
          example: II

        puuid:
          type: string
          description: Riot's globally unique player identifier.
          example: cQh4lD1Q7vK1L3o4...

        leaguePoints:
          type: integer
          example: 75

        wins:
          type: integer
          example: 142

        losses:
          type: integer
          example: 118